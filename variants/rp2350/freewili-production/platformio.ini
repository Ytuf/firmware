; Production build of the FreeWili 2 (RP2350B) Meshtastic firmware.
;
; Identical to env:freewili except that the PKI privkey is derived at boot
; from the RP2350's factory-unique 64-bit chip ID instead of the hardcoded
; FW2_FIXED_PRIVKEY dev constant. See NodeDB.cpp around the
; FW2_PER_UNIT_KEYPAIR block for the derivation. The dev env:freewili
; build continues to ship the well-known dev keypair so existing peer
; pubkey caches (tdeck etc.) keep matching during development.
;
; The variant pins (display/touch/UART radio/etc.) come from
; variants/rp2350/freewili/variant.h — no need to duplicate that here;
; this env reuses the same -I variants/rp2350/freewili search path that
; env:freewili sets up.
[env:freewili-production]
extends = env:freewili
build_flags =
  ${env:freewili.build_flags}
  -D FW2_PER_UNIT_KEYPAIR
