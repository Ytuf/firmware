[env:freewili]
extends = rp2350_base
board = freewili2  ; Custom RP2350B board (PICO_RP2350A=0, GPIO 0-47)
board_level = extra
upload_protocol = picotool

; --- Build speedups ---
; Persist compiled object files across `pio run` invocations. Biggest win
; on incremental rebuilds — unchanged .o files come from cache instead of
; recompiling. LDF still runs ("Scanning N dependencies") but the actual
; compile phase is dramatically shorter when most files are unchanged.
build_cache_dir = .pio/build_cache

build_flags =
  ${rp2350_base.build_flags}
  -D FREEWILI
  -D PRIVATE_HW
  -I variants/rp2350/freewili
  -D DEBUG_RP2040_PORT=Serial
  -D __WIRE0_DEVICE=i2c1
  -D DISABLE_WELCOME_UNSET
  -D HAS_BUTTON=0
  ; Removed ENABLE_AMBIENTLIGHTING — defaulting LEDs ON made the 7-chain
  ; emit blinding white. lateInitVariant() does an explicit clear+show so
  ; the chain starts in a clean OFF state. User can opt in via app config.
  ; BQ27441 fuel gauge at I2C1 0x55 is read via the freewili_bq27441_*
  ; helpers in variant.cpp (pico-sdk i2c1 with cached fallback). The
  ; mverch67 BQ27220 driver is ESP32-only and is not used here.

lib_deps =
  ${rp2350_base.lib_deps}
  lovyan03/LovyanGFX@1.2.19
  adafruit/Adafruit NeoPixel@^1.12.0   ; 7-LED chain on GPIO 21 (LED_SERIAL)

debug_tool = cmsis-dap

; Debug-friendly build: -Og keeps most lines in source order so stepping
; is sane, -g3 emits full DWARF + macro info. Env name kept short ("fw-debug"
; same length as "freewili") so .pio/libdeps/fw-debug/<long-lib-name>/...
; stays under the 260-char Windows MAX_PATH limit. Some library examples
; have filenames pushing close to the limit.
[env:fw-debug]
extends = env:freewili
build_type = debug
build_flags =
  ${env:freewili.build_flags}
  -Og
  -g3
  -ggdb3
