[env:freewili]
extends = rp2350_base
board = freewili2  ; Custom RP2350B board (PICO_RP2350A=0, GPIO 0-47)
board_level = extra
upload_protocol = picotool

; PIO-USB (device on GPIO 42/43) bit-bangs 12 Mbps full speed — sys_clk MUST
; be a multiple of 12 MHz. arduino-pico's RP2350 default (150 MHz) is not.
; 240 MHz (2026-07-02): the device-TX PIO divider is clk_sys/48MHz — 2.5 at
; 120 (fractional -> bit-edge jitter -> ~80% `meshtastic --info`, the
; occasional bulk-IN timeout), integer 5.0 at 240. 120 and 240 are the only
; clocks the sekigon pio_usb stack is validated at (144/192 are NOT).
;
; 240 needs two things arduino-pico does not do for RP2350 (its vreg bump is
; RP2040-only and it only retunes PSRAM m[1] QMI timing, not flash m[0]):
;   1. core voltage 1.15 V (default ~1.10 V is rated to ~150 MHz), and
;   2. a flash QMI divider raise BEFORE the PLL switch — the bootrom boots
;      with m[0].timing CLKDIV=3/RXDELAY=2 (0x60007203 measured live) =
;      80 MHz flash SCK at 240, far past the W25Q128JV's 50 MHz 03h-read
;      spec -> XIP garbage (verified live 2026-07-01). CLKDIV=6 restores
;      the proven 40 MHz of the old 120 baseline (120/3).
; Both live in src/platform/extra_variants/freewili/freewili_qmi.cpp as a
; wrap of set_sys_clock_pll (the out-of-line call under the core's inlined
; set_sys_clock_khz), plus wraps of flash_range_erase/_program/_do_cmd:
; pico-sdk re-runs the bootrom XIP-setup stub after EVERY flash op, which
; would silently revert the divider to CLKDIV=3 at the first LittleFS write.
;
; Testing gotcha: any SWD boot latches DHCSR.C_DEBUGEN, which independently
; breaks the CDC OPEN (SET_LINE_CODING fails, "device not functioning") at
; ANY f_cpu (see feedback_pio_usb_clock_sensitivity + tinyusb-tu-assert
; memory). Clear C_DEBUGEN (power-cycle, or OpenOCD mww 0xE000EDF0
; 0xA05F0000 on both cores) before judging CDC behavior.
;
; WS2812 (PIO divider from clock_get_hz), SerialPIO, UARTs and SPI all
; derive their timing from the live clock; audio uses busy_wait_us
; (hardware timer, clk-independent).
board_build.f_cpu = 240000000L

; --- Build speedups ---
; Persist compiled object files across `pio run` invocations. Biggest win
; on incremental rebuilds — unchanged .o files come from cache instead of
; recompiling. LDF still runs ("Scanning N dependencies") but the actual
; compile phase is dramatically shorter when most files are unchanged.
build_cache_dir = .pio/build_cache

build_flags =
  ${rp2350_base.build_flags}
  -D FREEWILI
  -D PRIVATE_HW
  -I variants/rp2350/freewili
  ; Static fallback position so the node map + Position screen work indoors with
  ; no satellite lock (a bare GNSS often never fixes indoors — including at the
  ; DEFCON booth). A real GPS fix, if one arrives, overrides it. Set the coords
  ; to the booth for the demo via -D FW_GPS_FALLBACK_LAT_I / _LON_I (1e-7 deg).
  -D FW_GPS_STATIC_FALLBACK
  -D DEBUG_RP2040_PORT=Serial
  -D __WIRE0_DEVICE=i2c1
  -D DISABLE_WELCOME_UNSET
  -D HAS_BUTTON=0
  ; --- Task 3 spike: native USB as HOST (reads u-blox M8 GPS on USB-A) ---
  ; USE_TINYUSB switches the native controller off the core's CDC-device stack
  ; onto Adafruit_TinyUSB; USE_TINYUSB_HOST then makes that native root (rhport0,
  ; GPIO66/67) a HOST (CFG_TUD_ENABLED=0, CFG_TUH_ENABLED=1, native — no PIO-USB).
  ; This intentionally drops the USB-serial console for the spike; the host
  ; driver + device-side no-op stubs live in extra_variants/freewili/usbhost/.
  -D USE_TINYUSB
  -D USE_TINYUSB_HOST
  ; Force ONE global TinyUSB config across every translation unit. tusb_option.h
  ; includes CFG_TUSB_CONFIG_FILE (if defined) instead of "tusb_config.h", so
  ; this bypasses the arduino-pico include-path race between the core's
  ; device-only include/tusb_config.h and Adafruit's host-aware one. Guarantees
  ; the host stack (usbh/hub/cdc_host) compiles with CFG_TUH_ENABLED + CFG_TUH_HUB
  ; so devices behind the CH334F hub can enumerate. File lives in the
  ; -I variants/rp2350/freewili dir already on the (global) include path.
  -D CFG_TUSB_CONFIG_FILE=\"tusb_config_freewili.h\"
  ; --- Task 5: Meshtastic CDC console as a PIO-USB DEVICE on rhport 1 ---
  ; dcd_pio_usb builds its config from PIO_USB_DEFAULT_CONFIG; the only way
  ; to pick pins is this define. GPIO 42 = USB_SEC_P (D+), 43 = USB_SEC_N
  ; (D-), the default DPDM order (see agents/hardware/pinouts.md).
  -D PIO_USB_DP_PIN_DEFAULT=42
  ; GPIO 42/43 are above the PIO's default 32-pin window. pio_usb only calls
  ; pio_set_gpio_base(16) when PICO_PIO_USE_GPIO_BASE is set (pio_usb.c:349);
  ; without it the PIO can't reach the pins and the device never presents its
  ; D+ pullup. libpico.a is built base-aware (pio_set_gpio_base is in it), so
  ; this matches the core.
  -D PICO_PIO_USE_GPIO_BASE=1
  ; Redirect the core's hardcoded TinyUSB_Device_Init(0) to rhport 1 so the
  ; device stack matches dcd_pio_usb's event tagging (root_id+1). See
  ; usbhost/freewili_dcd_pio_shims.cpp.
  -Wl,--wrap=TinyUSB_Device_Init
  ; 240 MHz support (see the f_cpu comment + freewili_qmi.cpp): vreg/QMI
  ; management at the clock raise, and QMI timing re-apply after each flash
  ; op (pico-sdk's XIP restore reverts the divider to the bootrom value).
  -Wl,--wrap=set_sys_clock_pll
  -Wl,--wrap=flash_range_erase
  -Wl,--wrap=flash_range_program
  -Wl,--wrap=flash_do_cmd
  ; Removed ENABLE_AMBIENTLIGHTING — defaulting LEDs ON made the 7-chain
  ; emit blinding white. lateInitVariant() does an explicit clear+show so
  ; the chain starts in a clean OFF state. User can opt in via app config.
  ; BQ27441 fuel gauge at I2C1 0x55 is read via the freewili_bq27441_*
  ; helpers in variant.cpp (pico-sdk i2c1 with cached fallback). The
  ; mverch67 BQ27220 driver is ESP32-only and is not used here.

lib_deps =
  ${rp2350_base.lib_deps}
  lovyan03/LovyanGFX@1.2.19
  adafruit/Adafruit NeoPixel@^1.12.0   ; 7-LED chain on GPIO 21 (LED_SERIAL)
  ; PIO-USB device PHY (GPIO 42/43, Task 5) is VENDORED at lib/pico_pio_usb —
  ; the registry "Pico PIO USB" package pulls an external Adafruit TinyUSB +
  ; SdFat dependency chain that collides with arduino-pico's bundled copies.

debug_tool = cmsis-dap

; Debug-friendly build: -Og keeps most lines in source order so stepping
; is sane, -g3 emits full DWARF + macro info. Env name kept short ("fw-debug"
; same length as "freewili") so .pio/libdeps/fw-debug/<long-lib-name>/...
; stays under the 260-char Windows MAX_PATH limit. Some library examples
; have filenames pushing close to the limit.
[env:fw-debug]
extends = env:freewili
build_type = debug
build_flags =
  ${env:freewili.build_flags}
  -Og
  -g3
  -ggdb3
